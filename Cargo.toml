[workspace]
resolver = "2"
members = ["app", "crates/form-render"]

[workspace.package]
version = "0.1.4"
edition = "2021"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bimoalfarrabi/form-rs"
homepage = "https://github.com/bimoalfarrabi/form-rs"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dist]
inherits = "release"
lto = "fat"
opt-level = 3
